name: Import NASA Hubble Galaxy Photos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Import official Hubble sources
        run: python scripts/import_hubble_galaxies.py
      - name: Commit imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/galaxy-images/
          if ! git diff --cached --quiet; then
            git commit -m "assets: import credited NASA Hubble galaxy imagery"
            git push
          fi
