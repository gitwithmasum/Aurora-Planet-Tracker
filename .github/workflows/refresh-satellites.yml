name: Refresh Multi-Satellite Catalog
on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_satellites.py'
      - '.github/workflows/refresh-satellites.yml'
permissions:
  contents: write
concurrency:
  group: satellite-catalog-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate orbital elements
        run: python scripts/refresh_satellites.py
      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/orbital-data/satellites.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh multi-satellite orbital catalog"
            git push
          fi
