name: Import NASA/JPL Planet Texture Maps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import_nasa_maps.py'
      - '.github/workflows/import-nasa-textures.yml'

permissions:
  contents: write

jobs:
  import-planet-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Download official JPL map files and attribution manifest
        run: python scripts/import_nasa_maps.py
      - name: Commit texture assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/planet-textures
          if ! git diff --cached --quiet; then
            git commit -m "assets: cache credited NASA-JPL planetary surface maps"
            git push origin HEAD:main
          fi
