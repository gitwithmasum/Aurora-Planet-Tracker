name: Refresh ISS Orbit Data
on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_iss.py'
      - '.github/workflows/refresh-iss.yml'
permissions:
  contents: write
concurrency:
  group: iss-orbit-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate ISS elements
        run: python scripts/refresh_iss.py
      - name: Commit fresh orbital data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/orbital-data/iss.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public ISS orbital elements"
            git push
          fi
