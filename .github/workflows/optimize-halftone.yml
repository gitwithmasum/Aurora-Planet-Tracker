name: Optimize Halftone Wallpaper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_halftone_art.py'
      - '.github/workflows/optimize-halftone.yml'

permissions:
  contents: write

concurrency:
  group: optimize-halftone
  cancel-in-progress: true

jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline rendering dependencies
        run: python -m pip install 'CairoSVG>=2.7,<3' 'Pillow>=11,<12'
      - name: Render compressed wallpaper from original source
        run: python scripts/optimize_halftone_art.py
      - name: Commit optimized wallpaper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/aurora-halftone.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: bundle rasterized halftone wallpaper for smoother scrolling"
            git push origin HEAD:main
          fi
